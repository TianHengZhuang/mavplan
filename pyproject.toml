[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mavplan"
version = "0.6.0"
description = "MAVLink mission planner: define waypoints and export to MAVLink, KML, CSV"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "TianHengZhuang", email = "464234120@qq.com" }
]
keywords = ["drone", "uav", "mavlink", "mission-planning", "waypoint", "px4", "ardupilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Aerospace",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
mavplan = "mavplan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mavplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
