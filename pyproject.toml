[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mavplan"
version = "1.12.0"
description = "MAVLink mission planner: waypoints, patterns, QGC/Mission-Planner interop, simulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "TianHengZhuang", email = "464234120@qq.com" }
]
keywords = ["drone", "uav", "mavlink", "mission-planning", "waypoint", "px4", "ardupilot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
mavlink = ["pymavlink>=2.4"]

[project.scripts]
mavplan = "mavplan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mavplan"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "mavplan/scenarios"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]
