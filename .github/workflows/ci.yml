name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest click
          pip install "tomli>=2.0; python_version < '3.11'"

      - name: Show environment
        env:
          PYTHONPATH: src
          MAVPLAN_SCENARIOS: ${{ github.workspace }}/scenarios
        run: |
          python -V
          ls scenarios | head
          python -c "import sys; sys.path.insert(0,'src'); from mavplan.scenario import default_scenarios_dir, list_scenarios; print(default_scenarios_dir()); print(list_scenarios())"

      - name: Run tests
        env:
          PYTHONPATH: src
          MAVPLAN_SCENARIOS: ${{ github.workspace }}/scenarios
        run: pytest -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src tests
